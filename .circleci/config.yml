version: 2.1
orbs:
  architect: giantswarm/architect@10.17.5

workflows:
  build:
    jobs:
    - architect/push-to-registries:
        context: architect
        name: push-to-registries
        platforms: linux/amd64,linux/arm64
        # Push only to gsoci here; the gsoci -> Aliyun mirror is handled
        # out-of-band by sync-china-registry below so the cross-Pacific push
        # cannot time out and block the chart catalog publish.
        split-china-push: true
        # The chart runs the image this job pushed: stamp its tag into
        # values.yaml, which the chart jobs attach before they package.
        post-steps:
          - run:
              name: Stamp the built image tag into values.yaml
              command: |
                set -euo pipefail
                version="$(cat .build_version)"
                test "$(grep -c '^      tag: ' helm/dex-app/values.yaml)" -eq 1
                sed -i -E "s/^(      tag: ).*/\1\"${version}\"/" helm/dex-app/values.yaml
                grep -n "^      tag: \"${version}\"$" helm/dex-app/values.yaml
          - persist_to_workspace:
              root: .
              paths:
                - helm/dex-app/values.yaml
        filters:
            # Trigger the job also on git tag.
          tags:
            only: /^v.*/
          branches:
            ignore:
            - main
            - master

    # Mirror gsoci -> Aliyun via the in-China giantswarm/galaxy-runner. Runs out
    # of band; an Aliyun mirror failure does NOT block the chart catalog publish.
    - architect/sync-china-registry:
        context: architect
        name: sync-china-registry
        requires:
        - push-to-registries
        filters:
          tags:
            only: /^v.*/
          branches:
            ignore:
            - main
            - master

    - architect/push-to-app-catalog:
        name: push-to-control-plane-app-catalog
        app_catalog: control-plane-catalog
        app_catalog_test: control-plane-test-catalog
        context: architect
        chart: dex-app
        executor: app-build-suite
        persist_chart_archive: true
        push_to_oci_registry: true
        attach_workspace: true
        requires:
        - push-to-registries
        filters:
            # Trigger the job also on git tag.
          tags:
            only: /^v.*/
          branches:
            ignore:
            - main
            - master

      # make it available to customers (only tags)
    - architect/push-to-app-catalog:
        name: package and push chart to giantswarm catalog
        app_catalog: giantswarm-catalog
        app_catalog_test: giantswarm-test-catalog
        chart: dex-app
        context: architect
        executor: app-build-suite
        push_to_oci_registry: true
        attach_workspace: true
        requires:
        - push-to-registries
        filters:
          tags:
            only: /^v.*/
          branches:
            ignore:
            - main
            - master

    - architect/push-to-app-catalog:
        name: package and push chart
        context: architect
        app_catalog: giantswarm-playground-catalog
        app_catalog_test: giantswarm-playground-test-catalog
        chart: dex-app
        executor: app-build-suite
        attach_workspace: true
        requires:
        - push-to-registries
        filters:
          tags:
            only: /^v.*/
          branches:
            ignore:
            - main
            - master

    - architect/run-tests-with-ats:
        name: execute chart tests
        filters:
            # Do not trigger the job on merge to master.
          branches:
            ignore:
            - master
        requires:
        - push-to-control-plane-app-catalog
        app-test-suite_version: v0.15.0
        app-test-suite_container_tag: 0.15.0
        additional_app-test-suite_flags: "--app-tests-app-config-file tests/test-values.yaml"
