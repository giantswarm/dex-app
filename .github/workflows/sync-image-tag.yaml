name: Sync image tag from Chart.yaml

# Runs when Chart.yaml is modified (e.g. by the release PR workflow)
# and syncs dex.image.tag in values.yaml to match appVersion.
on:
  push:
    branches:
      - 'main#release#*'
      - 'master#release#*'
      - 'release#*'
    paths:
      - 'helm/dex-app/Chart.yaml'

jobs:
  sync:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Generate giantswarm-release token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          # Check out and push the image tag sync commit to the release branch.
          permission-contents: write

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.40.5/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Sync image tag
        run: make sync-image-tag APPLICATION=helm/dex-app

      - name: Commit if changed
        run: |
          git config --local user.email "342014845+giantswarm-release[bot]@users.noreply.github.com"
          git config --local user.name "giantswarm-release[bot]"
          if git diff --quiet; then
            echo "No changes to commit"
          else
            git add helm/dex-app/values.yaml
            git commit -m "Sync dex.image.tag from Chart.yaml appVersion"
            git push
          fi
