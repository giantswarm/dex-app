{{/*
The dex Deployment is the vendored dex subchart's template, rendered here rather
than in the subchart so that its pod template carries the checksum of the dex
configuration this chart renders in templates/secret-gs.yaml. A subchart cannot
see its parent's values; from here, a configuration change rolls the pod in the
same helm upgrade that writes the secret, with or without a forced upgrade.

`clientSecretEnv` lists the static clients whose secret is a Secret reference;
the subchart template sets one environment variable per item, read by dex at
start-up through the `secretEnv` of the client in the configuration, projects
the referenced Secrets as files and compares the two in the liveness probe, so
a rotated client secret restarts the container (the `dex.clientSecrets.*`
helpers in _helpers.tpl).

`cluster.proxy` is the proxy the platform sets for a cluster behind one; dex
reaches the upstream identity providers through it. Its variables come before
`dex.envVars`, so an entry there with the same name wins.

`architecture` is merged into the subchart's nodeSelector and tolerations here
because the subchart cannot see parent values.

The pages of templates/configmap-web.yaml are mounted one file each over their
upstream copies in the image's web directory, so the image's other pages and
assets stay in place. A file mounted with subPath is not updated when the
ConfigMap changes, so the ConfigMap is part of the configuration checksum.
*/}}
{{- $dex := index .Subcharts "dex" -}}
{{- $values := deepCopy $dex.Values -}}
{{- $webVolume := "web-templates" -}}
{{- $_ := set $values "volumes" (append ($values.volumes | default list) (dict "name" $webVolume "configMap" (dict "name" (include "dex-app.webTemplates.name" .)))) -}}
{{- $mounts := $values.volumeMounts | default list -}}
{{- range $path, $_ := .Files.Glob "files/web/templates/*.html" -}}
{{- $mounts = append $mounts (dict "name" $webVolume "mountPath" (printf "/srv/dex/web/templates/%s" (base $path)) "subPath" (base $path) "readOnly" true) -}}
{{- end -}}
{{- $_ := set $values "volumeMounts" $mounts -}}
{{- $proxyEnv := list -}}
{{- with (.Values.cluster).proxy -}}
{{- range $name, $key := dict "HTTP_PROXY" "http" "HTTPS_PROXY" "https" "NO_PROXY" "noProxy" -}}
{{- with index $.Values.cluster.proxy $key -}}
{{- $proxyEnv = append $proxyEnv (dict "name" $name "value" .) -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- $_ := set $values "envVars" (concat $proxyEnv ($values.envVars | default list)) -}}
{{- $scheduling := include "dex-app.podScheduling" (dict "Values" (dict "architecture" .Values.architecture "nodeSelector" $values.nodeSelector "tolerations" $values.tolerations)) | fromYaml -}}
{{- $_ := set $values "nodeSelector" ($scheduling.nodeSelector | default dict) -}}
{{- $_ := set $values "tolerations" ($scheduling.tolerations | default list) -}}
{{- include "dex.deployment" (dict
      "Values" $values
      "Chart" $dex.Chart
      "Release" .Release
      "Capabilities" .Capabilities
      "configChecksum" (print (include (print $.Template.BasePath "/secret-gs.yaml") .) (include "dex-app.webTemplates.data" .) | sha256sum)
      "clientSecretEnv" (concat (include "dex.staticClients.secretRefs" . | fromYamlArray) (include "dex.connectors.secretRefs" . | fromYamlArray))) }}
