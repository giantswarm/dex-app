suite: dex Deployment
templates:
  - templates/deployment.yaml
  - templates/secret-gs.yaml
  - charts/dex/templates/deployment.yaml
tests:
  - it: renders the dex Deployment from the parent chart with a checksum of the dex configuration
    template: templates/deployment.yaml
    set:
      oidc.issuerAddress: dex.example.test
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: dex
      - equal:
          path: spec.template.spec.containers[0].name
          value: dex
      - equal:
          path: spec.template.spec.volumes[0].secret.secretName
          value: dex
      - matchRegex:
          path: spec.template.metadata.annotations["checksum/config"]
          pattern: ^[0-9a-f]{64}$
