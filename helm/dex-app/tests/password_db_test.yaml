suite: password database
templates:
  - templates/secret-gs.yaml
tests:
  - it: keeps the password database off by default
    set:
      oidc.issuerAddress: dex.example.test
    asserts:
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: "\nenablePasswordDB: false\n"
      - notMatchRegex:
          path: stringData["config.yaml"]
          pattern: "staticPasswords"

  - it: renders static users whose hashes come from the environment
    set:
      oidc.issuerAddress: dex.example.test
      oidc.passwordDB:
        enabled: true
        staticPasswords:
          - email: tester@example.test
            username: tester
            userID: 6b9a3f1e-0c55-4b8e-9d0e-2f1f6f0f7a11
            hashFromEnv: DEX_TESTER_HASH
    asserts:
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: "\nenablePasswordDB: true\nstaticPasswords:\n- email: \"tester@example.test\"\n  username: \"tester\"\n  userID: \"6b9a3f1e-0c55-4b8e-9d0e-2f1f6f0f7a11\"\n  hashFromEnv: \"DEX_TESTER_HASH\"\n"
      - notMatchRegex:
          path: stringData["config.yaml"]
          pattern: "\"hash\""

  - it: refuses a user without hashFromEnv
    set:
      oidc.issuerAddress: dex.example.test
      oidc.passwordDB:
        enabled: true
        staticPasswords:
          - email: tester@example.test
            username: tester
            userID: 6b9a3f1e-0c55-4b8e-9d0e-2f1f6f0f7a11
    asserts:
      - failedTemplate: {}
