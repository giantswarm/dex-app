suite: pod scheduling and the architecture value
templates:
  - templates/deployment.yaml
  - templates/secret-gs.yaml
  - charts/dex/templates/deployment.yaml
  - templates/dex-k8s-authenticator/deployment-customer.yaml
tests:
  - it: renders no scheduling fields by default
    # Guards backwards compatibility: an unset architecture must not add a
    # nodeSelector or tolerations, so bumping the chart causes no pod churn.
    template: templates/deployment.yaml
    set:
      oidc.issuerAddress: dex.example.test
    asserts:
      - notExists:
          path: spec.template.spec.nodeSelector
      - notExists:
          path: spec.template.spec.tolerations

  - it: pins to arm64 with both the node selector and the taint toleration
    # The arm64 pool is tainted, so the selector alone would leave the pod
    # Pending and the toleration alone would let it land on any pool.
    template: templates/deployment.yaml
    set:
      oidc.issuerAddress: dex.example.test
      architecture: arm64
    asserts:
      - equal:
          path: spec.template.spec.nodeSelector["kubernetes.io/arch"]
          value: arm64
      - contains:
          path: spec.template.spec.tolerations
          content:
            key: kubernetes.io/arch
            operator: Equal
            value: arm64
            effect: NoSchedule
      - lengthEqual:
          path: spec.template.spec.tolerations
          count: 1

  - it: pins to amd64 with the selector only, as amd64 pools carry no taint
    template: templates/deployment.yaml
    set:
      oidc.issuerAddress: dex.example.test
      architecture: amd64
    asserts:
      - equal:
          path: spec.template.spec.nodeSelector["kubernetes.io/arch"]
          value: amd64
      - notExists:
          path: spec.template.spec.tolerations

  - it: merges architecture with explicit nodeSelector and tolerations
    template: templates/deployment.yaml
    set:
      oidc.issuerAddress: dex.example.test
      architecture: arm64
      dex.nodeSelector:
        disktype: ssd
      dex.tolerations:
        - key: dedicated
          operator: Exists
          effect: NoSchedule
    asserts:
      - equal:
          path: spec.template.spec.nodeSelector["kubernetes.io/arch"]
          value: arm64
      - equal:
          path: spec.template.spec.nodeSelector.disktype
          value: ssd
      - lengthEqual:
          path: spec.template.spec.tolerations
          count: 2
      - contains:
          path: spec.template.spec.tolerations
          content:
            key: dedicated
            operator: Exists
            effect: NoSchedule

  - it: fails when nodeSelector contradicts architecture
    # A contradiction is a mistake, not a preference to arbitrate: architecture
    # also decides the toleration, so silently picking a winner would render
    # something neither setting asked for.
    template: templates/deployment.yaml
    set:
      oidc.issuerAddress: dex.example.test
      architecture: arm64
      dex.nodeSelector:
        kubernetes.io/arch: amd64
    asserts:
      - failedTemplate:
          errorPattern: 'architecture=arm64 conflicts with nodeSelector\."kubernetes\.io/arch"=amd64; set only one'

  - it: accepts a nodeSelector that agrees with architecture
    template: templates/deployment.yaml
    set:
      oidc.issuerAddress: dex.example.test
      architecture: arm64
      dex.nodeSelector:
        kubernetes.io/arch: arm64
    asserts:
      - equal:
          path: spec.template.spec.nodeSelector["kubernetes.io/arch"]
          value: arm64
      - lengthEqual:
          path: spec.template.spec.tolerations
          count: 1

  - it: renders nodeSelector without architecture
    template: templates/deployment.yaml
    set:
      oidc.issuerAddress: dex.example.test
      dex.nodeSelector:
        disktype: ssd
    asserts:
      - equal:
          path: spec.template.spec.nodeSelector.disktype
          value: ssd
      - notExists:
          path: spec.template.spec.nodeSelector["kubernetes.io/arch"]
      - notExists:
          path: spec.template.spec.tolerations

  - it: does not emit the arm64 toleration twice when it is already set
    template: templates/deployment.yaml
    set:
      oidc.issuerAddress: dex.example.test
      architecture: arm64
      dex.tolerations:
        - key: kubernetes.io/arch
          operator: Equal
          value: arm64
          effect: NoSchedule
    asserts:
      - lengthEqual:
          path: spec.template.spec.tolerations
          count: 1

  - it: adds the toleration when arm64 is pinned through nodeSelector alone
    # The coupling must hold whichever value sets the architecture. Without
    # this the pod gets the selector, no toleration, and stays Pending against
    # the tainted arm64 pool with no render error.
    template: templates/deployment.yaml
    set:
      oidc.issuerAddress: dex.example.test
      dex.nodeSelector:
        kubernetes.io/arch: arm64
    asserts:
      - equal:
          path: spec.template.spec.nodeSelector["kubernetes.io/arch"]
          value: arm64
      - contains:
          path: spec.template.spec.tolerations
          content:
            key: kubernetes.io/arch
            operator: Equal
            value: arm64
            effect: NoSchedule

  - it: adds no toleration when amd64 is pinned through nodeSelector alone
    template: templates/deployment.yaml
    set:
      oidc.issuerAddress: dex.example.test
      dex.nodeSelector:
        kubernetes.io/arch: amd64
    asserts:
      - equal:
          path: spec.template.spec.nodeSelector["kubernetes.io/arch"]
          value: amd64
      - notExists:
          path: spec.template.spec.tolerations

  - it: treats an Exists toleration as already covering the taint
    template: templates/deployment.yaml
    set:
      oidc.issuerAddress: dex.example.test
      architecture: arm64
      dex.tolerations:
        - key: kubernetes.io/arch
          operator: Exists
          effect: NoSchedule
    asserts:
      - lengthEqual:
          path: spec.template.spec.tolerations
          count: 1

  - it: treats an omitted operator as Equal, per the API default
    template: templates/deployment.yaml
    set:
      oidc.issuerAddress: dex.example.test
      architecture: arm64
      dex.tolerations:
        - key: kubernetes.io/arch
          value: arm64
          effect: NoSchedule
    asserts:
      - lengthEqual:
          path: spec.template.spec.tolerations
          count: 1

  - it: still adds the toleration when an existing one tolerates amd64 instead
    # Shares key and effect but does not tolerate the arm64 taint, so matching
    # on key+effect alone would wrongly drop a toleration the pod needs.
    template: templates/deployment.yaml
    set:
      oidc.issuerAddress: dex.example.test
      architecture: arm64
      dex.tolerations:
        - key: kubernetes.io/arch
          operator: Equal
          value: amd64
          effect: NoSchedule
    asserts:
      - lengthEqual:
          path: spec.template.spec.tolerations
          count: 2
      - contains:
          path: spec.template.spec.tolerations
          content:
            key: kubernetes.io/arch
            operator: Equal
            value: arm64
            effect: NoSchedule
  - it: rejects an unknown architecture
    template: templates/deployment.yaml
    set:
      oidc.issuerAddress: dex.example.test
      architecture: aarch64
    asserts:
      - failedTemplate:
          errorPattern: architecture

  - it: leaves the dex-k8s-authenticator Deployment unscheduled
    # The authenticator image is amd64-only, so architecture must not touch it.
    template: templates/dex-k8s-authenticator/deployment-customer.yaml
    set:
      architecture: arm64
      deployDexK8SAuthenticator: true
      oidc.issuerAddress: dex.example.test
    asserts:
      - notExists:
          path: spec.template.spec.nodeSelector
      - notExists:
          path: spec.template.spec.tolerations
