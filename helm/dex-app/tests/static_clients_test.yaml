suite: static client secrets
templates:
  - templates/secret-gs.yaml
  - templates/deployment.yaml
  - templates/NOTES.txt
  - charts/dex/templates/deployment.yaml
tests:
  - it: renders the configuration and the container environment of inline clients unchanged (golden)
    values:
      - ./values/inline-static-clients.yaml
    asserts:
      - template: templates/secret-gs.yaml
        matchSnapshot:
          path: stringData["config.yaml"]
      - template: templates/deployment.yaml
        matchSnapshot:
          path: spec.template.spec.containers[0].env

  - it: sets the environment variable of a referenced extra client and names it in the configuration
    set:
      oidc.issuerAddress: dex.example.test
      oidc.extraStaticClients:
        - id: platform-manager
          name: Platform manager
          secretRef:
            name: dex-client-platform-manager
            key: secret
          redirectURIs:
            - https://platform-manager.example.test/callback
    asserts:
      - template: templates/deployment.yaml
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DEX_CLIENT_SECRET_PLATFORM_MANAGER
            valueFrom:
              secretKeyRef:
                name: dex-client-platform-manager
                key: secret
      - template: templates/secret-gs.yaml
        matchRegex:
          path: stringData["config.yaml"]
          pattern: "- id: platform-manager\n(  .*\n)*  secretEnv: DEX_CLIENT_SECRET_PLATFORM_MANAGER\n"
      - template: templates/secret-gs.yaml
        notMatchRegex:
          path: stringData["config.yaml"]
          pattern: secretRef

  - it: sets the environment variable of a referenced pre-defined client and names it in the configuration
    set:
      oidc.issuerAddress: dex.example.test
      oidc.staticClients.muster:
        clientID: muster
        clientSecretRef:
          name: dex-client-muster
          key: client-secret
        redirectURI: https://muster.example.test/callback
    asserts:
      - template: templates/deployment.yaml
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DEX_CLIENT_SECRET_MUSTER
            valueFrom:
              secretKeyRef:
                name: dex-client-muster
                key: client-secret
      - template: templates/secret-gs.yaml
        matchRegex:
          path: stringData["config.yaml"]
          pattern: "- id: muster\n  secretEnv: DEX_CLIENT_SECRET_MUSTER\n  name: muster\n"

  - it: references the dex-k8s-authenticator secret once the chart default is cleared
    set:
      oidc.issuerAddress: dex.example.test
      isManagementCluster: true
      oidc.staticClients.dexK8SAuthenticator:
        clientSecret: ""
        clientSecretRef:
          name: dex-client-dex-k8s-authenticator
          key: secret
    asserts:
      - template: templates/deployment.yaml
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DEX_CLIENT_SECRET_DEX_K8S_AUTHENTICATOR
            valueFrom:
              secretKeyRef:
                name: dex-client-dex-k8s-authenticator
                key: secret
      - template: templates/secret-gs.yaml
        matchRegex:
          path: stringData["config.yaml"]
          pattern: "name: dex-k8s-authenticator\n  secretEnv: DEX_CLIENT_SECRET_DEX_K8S_AUTHENTICATOR\n"

  - it: renders a public extra client without any secret
    set:
      oidc.issuerAddress: dex.example.test
      oidc.extraStaticClients:
        - id: public-client
          name: Public client
          public: true
    asserts:
      - template: templates/secret-gs.yaml
        matchRegex:
          path: stringData["config.yaml"]
          pattern: "- id: public-client\n  name: Public client\n  public: true\n"

  - it: fails naming the client when an extra client sets both secret and secretRef
    set:
      oidc.extraStaticClients:
        - id: both-forms
          name: Both forms
          secret: inline-secret
          secretRef:
            name: dex-client-both-forms
            key: secret
    asserts:
      - template: templates/secret-gs.yaml
        failedTemplate:
          errorPattern: 'static client "both-forms" sets more than one of secret, secretEnv and secretRef'

  - it: fails naming the client when a confidential extra client sets no secret at all
    set:
      oidc.extraStaticClients:
        - id: no-secret
          name: No secret
    asserts:
      - template: templates/secret-gs.yaml
        failedTemplate:
          errorPattern: 'static client "no-secret" sets none of secret, secretEnv and secretRef'

  - it: uses the reference and ignores the inline clientSecret when a pre-defined client sets both, and names it in the notes
    values:
      - ./values/inline-static-clients.yaml
    set:
      oidc.staticClients.muster.clientSecretRef:
        name: dex-client-muster
        key: secret
    asserts:
      - template: templates/deployment.yaml
        equal:
          path: spec.template.spec.containers[0].env
          value:
            - name: DEX_CLIENT_SECRET_MUSTER
              valueFrom:
                secretKeyRef:
                  name: dex-client-muster
                  key: secret
      - template: templates/secret-gs.yaml
        matchRegex:
          path: stringData["config.yaml"]
          pattern: "- id: muster\n  secretEnv: DEX_CLIENT_SECRET_MUSTER\n  name: muster\n"
      - template: templates/secret-gs.yaml
        notMatchRegex:
          path: stringData["config.yaml"]
          pattern: muster-secret
      - template: templates/secret-gs.yaml
        matchRegex:
          path: stringData["config.yaml"]
          pattern: "- id: gitopsui\n  secret: gitopsui-secret\n"
      - template: templates/NOTES.txt
        matchRegexRaw:
          pattern: "Static clients whose inline clientSecret is ignored: clientSecretRef takes precedence\nand the client reads its secret from the referenced Secret. Delete the clientSecret\nfrom the values that carry it.\n  - oidc.staticClients.muster \\(clientID muster\\)\n"
      - template: templates/NOTES.txt
        notMatchRegexRaw:
          pattern: left out

  - it: leaves out a pre-defined client whose clientID is set without a secret source and names it in the notes
    values:
      - ./values/inline-static-clients.yaml
    set:
      oidc.staticClients.gitopsui.clientSecret: ""
      oidc.staticClients.mcpCapi.clientID: mcp-capi
      oidc.staticClients.mcpCapi.redirectURI: https://mcp-capi.example.test/oauth/callback
    asserts:
      - template: templates/secret-gs.yaml
        notMatchRegex:
          path: stringData["config.yaml"]
          pattern: "id: (gitopsui|mcp-capi)\n"
      - template: templates/secret-gs.yaml
        matchRegex:
          path: stringData["config.yaml"]
          pattern: "staticClients:\n- id: grafana\n"
      - template: templates/secret-gs.yaml
        matchRegex:
          path: stringData["config.yaml"]
          pattern: "- id: muster\n  secret: muster-secret\n"
      - template: templates/deployment.yaml
        isNullOrEmpty:
          path: spec.template.spec.containers[0].env
      - template: templates/NOTES.txt
        matchRegexRaw:
          pattern: "left out of the dex configuration.*\n.*\n  - oidc.staticClients.gitopsui \\(clientID gitopsui\\)\n  - oidc.staticClients.mcpCapi \\(clientID mcp-capi\\)\n"

  - it: prints no notes while every declared client has a secret source
    values:
      - ./values/inline-static-clients.yaml
    asserts:
      - template: templates/NOTES.txt
        equalRaw:
          value: ""

  - it: fails when dex-k8s-authenticator has neither the chart default nor a reference
    set:
      isManagementCluster: true
      oidc.staticClients.dexK8SAuthenticator.clientSecret: ""
    asserts:
      - template: templates/secret-gs.yaml
        failedTemplate:
          errorPattern: 'static client "dex-k8s-authenticator" sets none of oidc.staticClients.dexK8SAuthenticator.clientSecret'

  - it: fails when the dex-k8s-authenticator reference is set on top of the chart default
    set:
      isManagementCluster: true
      oidc.staticClients.dexK8SAuthenticator.clientSecretRef:
        name: dex-client-dex-k8s-authenticator
        key: secret
    asserts:
      - template: templates/secret-gs.yaml
        failedTemplate:
          errorPattern: 'static client "dex-k8s-authenticator" sets more than one of oidc.staticClients.dexK8SAuthenticator.clientSecret \(a chart default; set it to "" to use the reference\)'

  - it: fails when a reference comes with idEnv instead of a literal id
    set:
      oidc.extraStaticClients:
        - idEnv: CLIENT_ID
          name: From the environment
          secretRef:
            name: dex-client
            key: secret
    asserts:
      - template: templates/secret-gs.yaml
        failedTemplate:
          errorPattern: 'extra static client "From the environment": secretRef needs a literal id, not idEnv'

  - it: fails when a reference lacks the key
    set:
      oidc.extraStaticClients:
        - id: half-reference
          name: Half reference
          secretRef:
            name: dex-client-half-reference
    asserts:
      - template: templates/secret-gs.yaml
        failedTemplate:
          errorPattern: 'static client "half-reference": the secret reference needs name and key'

  - it: fails when two client ids map to the same environment variable
    set:
      oidc.extraStaticClients:
        - id: a-b
          name: A dash B
          secretRef:
            name: dex-client-a-b
            key: secret
        - id: a.b
          name: A dot B
          secretRef:
            name: dex-client-a-dot-b
            key: secret
    asserts:
      - template: templates/secret-gs.yaml
        failedTemplate:
          errorPattern: 'static client "a.b": another client''s id also maps to the variable DEX_CLIENT_SECRET_A_B'

  - it: renders mcpCapi and mcpPrometheus from an inline clientSecret and lists them as trusted peers of dex-k8s-authenticator
    set:
      oidc.issuerAddress: dex.example.test
      isManagementCluster: true
      oidc.staticClients.mcpCapi:
        clientID: mcp-capi
        clientSecret: mcp-capi-secret
        redirectURI: https://mcp-capi.example.test/oauth/callback
      oidc.staticClients.mcpPrometheus:
        clientID: mcp-prometheus
        clientSecret: mcp-prometheus-secret
        redirectURI: https://mcp-prometheus.example.test/oauth/callback
    asserts:
      - template: templates/secret-gs.yaml
        matchRegex:
          path: stringData["config.yaml"]
          pattern: "- id: mcp-capi\n  secret: mcp-capi-secret\n  name: MCP CAPI\n  redirectURIs:\n  - https://mcp-capi.example.test/oauth/callback\n"
      - template: templates/secret-gs.yaml
        matchRegex:
          path: stringData["config.yaml"]
          pattern: "- id: mcp-prometheus\n  secret: mcp-prometheus-secret\n  name: MCP Prometheus\n  redirectURIs:\n  - https://mcp-prometheus.example.test/oauth/callback\n"
      - template: templates/secret-gs.yaml
        matchRegex:
          path: stringData["config.yaml"]
          pattern: "name: dex-k8s-authenticator\n  secret: default-client-dex-authenticator-secret\n  trustedPeers:\n(  - .*\n)*  - mcp-capi\n  - mcp-prometheus\n"

  - it: sets the environment variable of a referenced mcpPrometheus client and names it in the configuration
    set:
      oidc.issuerAddress: dex.example.test
      oidc.staticClients.mcpPrometheus:
        clientID: mcp-prometheus
        clientSecretRef:
          name: dex-client-mcp-prometheus
          key: secret
        redirectURI: https://mcp-prometheus.example.test/oauth/callback
    asserts:
      - template: templates/deployment.yaml
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DEX_CLIENT_SECRET_MCP_PROMETHEUS
            valueFrom:
              secretKeyRef:
                name: dex-client-mcp-prometheus
                key: secret
      - template: templates/secret-gs.yaml
        matchRegex:
          path: stringData["config.yaml"]
          pattern: "- id: mcp-prometheus\n  secretEnv: DEX_CLIENT_SECRET_MCP_PROMETHEUS\n  name: MCP Prometheus\n"

  - it: sets the environment variable of a referenced mcpCapi client and names it in the configuration
    set:
      oidc.issuerAddress: dex.example.test
      oidc.staticClients.mcpCapi:
        clientID: mcp-capi
        clientSecretRef:
          name: dex-client-mcp-capi
          key: secret
        redirectURI: https://mcp-capi.example.test/oauth/callback
    asserts:
      - template: templates/deployment.yaml
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DEX_CLIENT_SECRET_MCP_CAPI
            valueFrom:
              secretKeyRef:
                name: dex-client-mcp-capi
                key: secret
      - template: templates/secret-gs.yaml
        matchRegex:
          path: stringData["config.yaml"]
          pattern: "- id: mcp-capi\n  secretEnv: DEX_CLIENT_SECRET_MCP_CAPI\n  name: MCP CAPI\n"

  - it: uses the reference and ignores the inline clientSecret of mcpPrometheus, and lists it in the notes after a client without a secret source
    set:
      oidc.issuerAddress: dex.example.test
      oidc.staticClients.mcpCapi.clientID: mcp-capi
      oidc.staticClients.mcpPrometheus:
        clientID: mcp-prometheus
        clientSecret: inline-secret
        clientSecretRef:
          name: dex-client-mcp-prometheus
          key: secret
        redirectURI: https://mcp-prometheus.example.test/oauth/callback
    asserts:
      - template: templates/deployment.yaml
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DEX_CLIENT_SECRET_MCP_PROMETHEUS
            valueFrom:
              secretKeyRef:
                name: dex-client-mcp-prometheus
                key: secret
      - template: templates/secret-gs.yaml
        matchRegex:
          path: stringData["config.yaml"]
          pattern: "- id: mcp-prometheus\n  secretEnv: DEX_CLIENT_SECRET_MCP_PROMETHEUS\n  name: MCP Prometheus\n"
      - template: templates/secret-gs.yaml
        notMatchRegex:
          path: stringData["config.yaml"]
          pattern: inline-secret
      - template: templates/NOTES.txt
        matchRegexRaw:
          pattern: "left out of the dex configuration.*\n.*\n  - oidc.staticClients.mcpCapi \\(clientID mcp-capi\\)\n\nStatic clients whose inline clientSecret is ignored.*\n.*\n.*\n  - oidc.staticClients.mcpPrometheus \\(clientID mcp-prometheus\\)\n"

  - it: leaves out mcpCapi and mcpPrometheus declared without a secret source and keeps them as trusted peers of dex-k8s-authenticator
    set:
      oidc.issuerAddress: dex.example.test
      isManagementCluster: true
      oidc.staticClients.mcpCapi.clientID: mcp-capi
      oidc.staticClients.mcpPrometheus.clientID: mcp-prometheus
    asserts:
      - template: templates/secret-gs.yaml
        notMatchRegex:
          path: stringData["config.yaml"]
          pattern: "id: mcp-"
      - template: templates/secret-gs.yaml
        matchRegex:
          path: stringData["config.yaml"]
          pattern: "name: dex-k8s-authenticator\n  secret: default-client-dex-authenticator-secret\n  trustedPeers:\n(  - .*\n)*  - mcp-capi\n  - mcp-prometheus\n"
      - template: templates/NOTES.txt
        matchRegexRaw:
          pattern: "  - oidc.staticClients.mcpCapi \\(clientID mcp-capi\\)\n  - oidc.staticClients.mcpPrometheus \\(clientID mcp-prometheus\\)\n"
